# CI + release for the cajeta-ml library (.cja) — the ecosystem-standard
# shape (cajeta-xgboost's workflow):
#
#   - push to main         → build + test (no publish)
#   - push a `v*` tag      → build + test + publish (GitHub Release + Olla)
#   - workflow_dispatch    → dry-run (build+test) or production (also publishes)
#
# Bare-runner flow: install the pinned cajeta toolchain from the cajeta
# repo's GitHub Release; ./run-tests.sh takes its Olla-fetch path for
# dev.cajeta.unit. The Olla publish self-arms when OLLA_* secrets exist on
# this repo; until then releases bridge via cajeta-logging's publish-sibling
# workflow (authorized 2026-07-29).

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, production]

permissions:
  contents: write

env:
  # Must match a release tag of jklappenbach/cajeta.
  #
  # v0.14.1 makes compilation DETERMINISTIC: the compiler's source walk was
  # unsorted, so a fresh checkout parsed files in a different order than a
  # working copy. Order decides when the lazy cajeta.math package becomes
  # concrete, and GradTape's `ArrayList<Tensor<E>>` fields need the real
  # Tensor to instantiate — so this library built clean on a developer's
  # machine and failed HERE, on identical sources. Do not pin back below
  # v0.14.1; the failure is invisible locally.
  #
  # v0.14.0 (inherited) REMOVED cajeta.nucleo.nn / cajeta.nucleo.optim from
  # the standard library — this library is where they went (ml.nn / ml.optim),
  # so building against it proves the two copies are not both live. It also
  # carries the bounded-method-template fix that GradTape<E extends Floating>
  # needs, on top of v0.13.0's nucleo.sparse and codegen fixes.
  #
  # v0.17.0 ships cajeta.math.distance — the Metric seam every clustering
  # estimator and manifold method consumes (0.6.0's unsupervised surface
  # does not BUILD below it) — plus math.random.Generator's stabilized
  # surface and the linalg pieces (eigh/svd/solve/pinv/slogdet) the
  # decomposition family rides. 0.5.0 (the neural re-home) baselines
  # v0.16.0+; this pin supersedes it compatibly — do not step back.
  #
  # v0.29.0 is NOT here for being the newest. Nothing in cajeta-ml's own
  # sources needs the floor, and that was measured rather than assumed:
  # with the unit pin at 0.3.0 the suite is 391 passed / 0 failed /
  # 1 skipped on v0.26.0 and identically on v0.29.0, and the manifest
  # parses on both. Two checked reasons put it here anyway.
  #
  # First, a consumer's compiler re-checks a DEPENDENCY archive's own
  # sources, so the toolchain a consumer gates on decides whether this
  # library's sources are acceptable — not the toolchain that cut the
  # .cja. cajeta-recsys, cajeta-timeseries and cajeta-xgboost all depend
  # on dev.cajeta.ml, so gating here on what they gate on is the only
  # thing that proves ml survives the checks they will run. The reverse
  # case is what moved the dev-dependency in this same cut: unit 0.2.4
  # links clean under v0.26.0 and is REJECTED under v0.29.0's
  # captured-borrow check, inside ml's own test build, naming a `pred`
  # field that lives in cajeta-unit and not in this library.
  #
  # Second, v0.29.0 validates every task's exec action. It caught the
  # `clean` task asking for a program named "rm -rf build": exec runs a
  # program directly with no shell, so that task had never been able to
  # run. Pinning here is what stops a dead task passing CI again.
  # v0.35.0 enforces the field-store rule, which consumers apply to this
  # library's sources, so ml gates on it.
  # v0.36.0 extends that rule to holders passed with `#`, so ml gates on it.
  # v0.39.0 is the release the fleet republishes on.
  CAJETA_VERSION: v0.39.0

jobs:
  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cajeta-ml
        uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || true

      - name: Run the test suite
        timeout-minutes: 30
        run: ./run-tests.sh

      - name: Run the tour (self-checking)
        timeout-minutes: 20
        run: ./run-tour.sh

      - name: Build the release .cja
        id: build
        run: |
          set -euo pipefail
          # cajeta.json is the single source of truth for the version; it is
          # JSONC, so read it through the toolchain, not jq.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::tag v${tag_version} disagrees with cajeta.json version ${VERSION} — bump the manifest or retag" >&2
              exit 1
            fi
          fi
          cajeta build
          art="build/archive/dev.cajeta.ml-${VERSION}.cja"
          [ -f "$art" ] || { echo "::error::expected $art after cajeta build" >&2; exit 1; }
          echo "artifact=$art" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload .cja as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-ml-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.artifact }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.build.outputs.version) }}
          name: cajeta-ml ${{ steps.build.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.artifact }}

      # Secrets cannot appear in `if:` directly, hence the detect step. Until
      # OLLA_* secrets are set on THIS repo, publishes bridge via
      # cajeta-logging's publish-sibling workflow and this step skips loudly.
      - name: Detect Olla credentials
        id: creds
        env:
          T: ${{ secrets.OLLA_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no OLLA_* secrets on this repo — the Olla publish is SKIPPED; bridge via cajeta-logging's publish-sibling or add the secrets"
          fi

      - name: Publish to Olla
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')) && steps.creds.outputs.have == 'true'
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.artifact }}
          version: ${{ steps.build.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
