# CI for cajeta-ml: build + test on every main push (the release half —
# tag → GitHub Release + Olla publish — lands with plan Unit 9).
#
# Bare-runner flow: install the pinned cajeta toolchain from the cajeta
# repo's GitHub Release, then ./run-tests.sh takes its Olla-fetch path for
# dev.cajeta.unit (no sibling checkout on a runner).

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Must match a release tag of jklappenbach/cajeta.
  CAJETA_VERSION: v0.11.0

jobs:
  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cajeta-ml
        uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || true

      - name: Run the test suite
        timeout-minutes: 30
        run: ./run-tests.sh

      - name: Build the .cja
        run: |
          set -euo pipefail
          cajeta build
          ls build/archive/dev.cajeta.ml-*.cja
